name: CI

# Runs the pytest suite on every push and pull request.
#
# WHAT THIS DOES NOT RUN, AND WHY: `python3 tools/liveness_gates.py` is the project's
# 129-gate manuscript check, and it CANNOT run here. On a clean clone it passes 75 gates
# and then dies with an unhandled FileNotFoundError reading
# hazard/data/cohort_month_panel.parquet -- one of the two Freddie-derived files
# deliberately un-shipped for licensing in be79304 ("they stay on his disk"). Gates 76-129
# never execute. Running it in CI would report a hard failure on every commit for a reason
# that has nothing to do with the commit, so it is left out until that hard dependency is
# made optional. Run it locally, where the data is present.
#
# The pytest suite has no such problem: every test is expected to pass, and the only two that
# skip announce themselves -- the PDF render gate (no built PDF in a checkout) and the
# parquet-dependent reconciliation test (the un-shipped Freddie data). No expected count is
# written here on purpose: it moves every round, and a stale one reads as a failure. This
# run is the authority.
# tests/test_printed_values_reconcile.py -- which re-derives the manuscript's printed
# values from their committed artifacts -- otherwise runs in full here, because every
# artifact it reads is tracked.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -q --no-header -rs

      - name: Confirm the two manuscript editions stay in sync
        # They must be byte-identical apart from ONE line, the abstract. A
        # half-applied edit to one edition is otherwise invisible.
        # The differing line is located, not typed: this step hard-coded "31"
        # until a 2026-09 preamble addition moved the abstract to 38 and the
        # check began comparing the wrong line.
        run: |
          python3 - <<'PY'
          import sys
          a = open("paper/final/paper_final_v1.tex").read().split("\n")
          b = open("paper/final/paper_final_v1_long_abstract.tex").read().split("\n")
          if len(a) != len(b):
              sys.exit(f"editions differ in length: {len(a)} vs {len(b)} lines")
          diff = [i + 1 for i, (x, y) in enumerate(zip(a, b)) if x != y]
          if len(diff) != 1:
              sys.exit(f"editions differ on {len(diff)} lines, expected exactly 1 (the abstract): {diff[:20]}")
          line = diff[0]
          begin = next(i for i, l in enumerate(a, 1) if "\\begin{abstract}" in l)
          end = next(i for i, l in enumerate(a, 1) if "\\end{abstract}" in l)
          if not begin < line < end:
              sys.exit(f"the one differing line ({line}) is outside the abstract ({begin}-{end})")
          print(f"editions in sync (identical apart from the abstract, line {line})")
          PY
